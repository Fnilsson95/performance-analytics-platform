services:
  postgres:
    image: postgres:17
    container_name: pap-postgres
    environment:
      POSTGRES_DB: performance_analytics
      POSTGRES_USER: pap
      POSTGRES_PASSWORD: local_dev_only
    ports: ["5433:5432"]
    volumes: ["pap-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pap -d performance_analytics"]
      interval: 5s
      retries: 10

volumes:
  pap-pgdata:
